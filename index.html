<!DOCTYPE html>
<html lang="sv">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#f4f1ea">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>Fältanteckningar</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="icon" href="icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Fraunces:opsz,wght@9..144,600&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#f4f1ea; --card:#fffdf8; --ink:#1f1d1a; --muted:#77716a; --line:#e4ded3;
  --accent:#2f5d50; --accent-ink:#fff; --danger:#b3412f; --chip:#ece7dc;
  --r:14px; --shadow:0 1px 2px rgba(0,0,0,.05),0 4px 14px rgba(0,0,0,.06);
  --st:env(safe-area-inset-top,0px); --sb:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme:dark){
  :root{--bg:#161513;--card:#201f1c;--ink:#f1ede5;--muted:#a19a90;--line:#33302b;--accent:#7fb8a4;--accent-ink:#0f1a16;--chip:#2c2a26;--danger:#e0735f;--shadow:0 1px 2px rgba(0,0,0,.4)}
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.45 Inter,system-ui,sans-serif}
button,input,textarea,select{font:inherit;color:inherit}
button{cursor:pointer;border:0;background:none}
.hidden{display:none!important}

header{position:sticky;top:0;z-index:5;background:color-mix(in srgb,var(--bg) 92%,transparent);backdrop-filter:blur(10px);
  padding:calc(var(--st) + 14px) 16px 10px;border-bottom:1px solid var(--line)}
.toprow{display:flex;align-items:center;gap:10px}
h1{font:600 24px/1.1 Fraunces,Georgia,serif;margin:0;flex:1;letter-spacing:-.01em}
.iconbtn{width:40px;height:40px;border-radius:12px;display:grid;place-items:center;background:var(--chip)}
.iconbtn svg{width:20px;height:20px}
.search{margin-top:10px;display:flex;gap:8px}
.search input{flex:1;padding:10px 12px;border-radius:12px;border:1px solid var(--line);background:var(--card);outline:none}
.search input:focus{border-color:var(--accent)}
.chips{display:flex;gap:6px;overflow-x:auto;padding:10px 0 2px;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chip{flex:none;display:inline-flex;align-items:center;gap:6px;padding:6px 11px;border-radius:999px;background:var(--chip);font-size:13px;font-weight:500;border:1.5px solid transparent;white-space:nowrap}
.chip .dot{width:8px;height:8px;border-radius:50%}
.chip.on{border-color:var(--ink);background:var(--card)}
.mode{font-size:12px;color:var(--muted);margin-top:6px}

main{padding:8px 16px calc(var(--sb) + 110px);max-width:720px;margin:0 auto}
.day{font-size:12px;font-weight:600;color:var(--muted);text-transform:uppercase;letter-spacing:.06em;margin:20px 2px 8px}
.note{background:var(--card);border-radius:var(--r);box-shadow:var(--shadow);padding:12px 14px;margin-bottom:10px;display:flex;gap:12px;width:100%;text-align:left}
.note .body{flex:1;min-width:0}
.note time{font-size:13px;font-weight:600;color:var(--accent)}
.note .meta{display:flex;align-items:center;gap:6px}
.note .mood{font-size:15px;line-height:1}
.note h3{margin:2px 0 0;font-size:15.5px;font-weight:600;word-break:break-word}
.note .preview{margin:2px 0 6px;color:var(--ink);white-space:normal;word-break:break-word}
.moodpick{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.moodpick button{display:flex;flex-direction:column;align-items:center;gap:2px;padding:10px 6px;border-radius:12px;background:var(--card);border:1.5px solid var(--line);font-size:13px;font-weight:500;color:var(--muted)}
.moodpick button .e{font-size:28px;line-height:1.1;filter:grayscale(1);opacity:.55;transition:all .15s}
.moodpick button.on{border-color:var(--accent);color:var(--ink);background:color-mix(in srgb,var(--accent) 10%,var(--card))}
.moodpick button.on .e{filter:none;opacity:1;transform:scale(1.08)}
.dtitle{font:600 22px/1.2 Fraunces,Georgia,serif;margin-bottom:4px;word-break:break-word}
.dmood{display:inline-flex;align-items:center;gap:6px;font-size:14px;color:var(--muted);margin-bottom:12px}
.dmood span{font-size:20px}
.note p{margin:3px 0 6px;white-space:pre-wrap;word-break:break-word;display:-webkit-box;-webkit-line-clamp:4;-webkit-box-orient:vertical;overflow:hidden}
.note .tags{display:flex;flex-wrap:wrap;gap:4px}
.note .tags .chip{padding:2px 8px;font-size:11.5px}
.thumb{flex:none;width:64px;height:64px;border-radius:10px;overflow:hidden;background:var(--chip);position:relative}
.thumb img,.thumb video{width:100%;height:100%;object-fit:cover;display:block}
.thumb .badge{position:absolute;right:4px;bottom:4px;background:rgba(0,0,0,.6);color:#fff;font-size:10px;font-weight:600;border-radius:6px;padding:1px 5px}
.empty{text-align:center;color:var(--muted);padding:60px 20px}
.empty b{display:block;color:var(--ink);font-size:17px;margin-bottom:6px}

.fab{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(var(--sb) + 18px);z-index:6;background:var(--accent);color:var(--accent-ink);
  border-radius:999px;padding:15px 24px;font-weight:600;display:flex;align-items:center;gap:8px;box-shadow:0 6px 20px rgba(0,0,0,.2)}
.fab svg{width:20px;height:20px}

/* sheets */
.sheet-bg{position:fixed;inset:0;background:rgba(0,0,0,.35);z-index:20;display:flex;align-items:flex-end;justify-content:center}
.sheet{background:var(--bg);width:100%;max-width:720px;max-height:94vh;max-height:94dvh;border-radius:20px 20px 0 0;display:flex;flex-direction:column;animation:up .22s ease}
@keyframes up{from{transform:translateY(30px);opacity:.4}}
.sheet-head{display:flex;align-items:center;gap:8px;padding:14px 16px;border-bottom:1px solid var(--line)}
.sheet-head h2{flex:1;margin:0;font-size:17px;font-weight:600}
.sheet-body{overflow-y:auto;padding:16px;flex:1}
.sheet-foot{padding:12px 16px calc(var(--sb) + 12px);border-top:1px solid var(--line);display:flex;gap:10px}
.btn{padding:12px 16px;border-radius:12px;font-weight:600;background:var(--chip)}
.btn.primary{background:var(--accent);color:var(--accent-ink);flex:1}
.btn.danger{color:var(--danger)}
.btn:disabled{opacity:.5}
label.lbl{display:block;font-size:12px;font-weight:600;color:var(--muted);text-transform:uppercase;letter-spacing:.05em;margin:16px 0 6px}
label.lbl:first-child{margin-top:0}
.field{width:100%;padding:11px 12px;border-radius:12px;border:1px solid var(--line);background:var(--card);outline:none}
.field:focus{border-color:var(--accent)}
textarea.field{min-height:120px;resize:vertical}
.mediabtns{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.mbtn{display:flex;align-items:center;gap:8px;justify-content:center;padding:12px 8px;border-radius:12px;background:var(--card);border:1px solid var(--line);font-weight:500;font-size:14px}
.mbtn svg{width:19px;height:19px;color:var(--accent)}
.mediagrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(96px,1fr));gap:8px;margin-top:10px}
.mitem{position:relative;aspect-ratio:1;border-radius:10px;overflow:hidden;background:var(--chip)}
.mitem img,.mitem video{width:100%;height:100%;object-fit:cover;display:block}
.mitem .x{position:absolute;top:4px;right:4px;width:26px;height:26px;border-radius:50%;background:rgba(0,0,0,.6);color:#fff;font-size:16px;line-height:26px;text-align:center}
.mitem .badge{position:absolute;left:4px;bottom:4px;background:rgba(0,0,0,.6);color:#fff;font-size:10px;font-weight:600;border-radius:6px;padding:1px 5px}
.tagpick{display:flex;flex-wrap:wrap;gap:6px}
.linkbtn{color:var(--accent);font-weight:600;font-size:14px;padding:8px 0}
.hint{font-size:12.5px;color:var(--muted);margin-top:6px}

/* location */
.toggle{display:flex;align-items:center;gap:10px;padding:10px 12px;background:var(--card);border:1px solid var(--line);border-radius:12px;font-weight:500}
.toggle input{appearance:none;width:42px;height:24px;border-radius:999px;background:var(--line);position:relative;margin:0;flex:none;transition:background .15s}
.toggle input::after{content:"";position:absolute;top:3px;left:3px;width:18px;height:18px;border-radius:50%;background:#fff;transition:left .15s;box-shadow:0 1px 2px rgba(0,0,0,.3)}
.toggle input:checked{background:var(--accent)}
.toggle input:checked::after{left:21px}
.locbox{margin-top:10px;display:flex;flex-direction:column;gap:8px}
.locstatus{font-size:13px;color:var(--muted)}
.locstatus.ok{color:var(--accent);font-weight:500}
.note .loc{display:flex;align-items:center;gap:4px;font-size:12.5px;color:var(--muted);margin:-2px 0 6px}
.note .loc svg,.dloc svg{width:13px;height:13px;flex:none}
.dloc{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:10px 12px;margin-bottom:12px}
.dloc .nm{display:flex;align-items:center;gap:6px;font-weight:600}
.dloc .co{font-size:13px;color:var(--muted);margin:2px 0 6px;font-variant-numeric:tabular-nums}
.dloc a{color:var(--accent);font-weight:600;font-size:14px;margin-right:14px;text-decoration:none}

/* tag manager */
.trow{display:flex;align-items:center;gap:8px;background:var(--card);border-radius:12px;padding:6px 8px;margin-bottom:8px;border:1px solid var(--line)}
.trow input{flex:1;border:0;background:none;outline:none;padding:6px 4px}
.swatch{width:28px;height:28px;border-radius:50%;flex:none;border:2px solid var(--card);box-shadow:0 0 0 1px var(--line)}
.trow .count{font-size:12px;color:var(--muted)}
.palette{display:flex;flex-wrap:wrap;gap:8px;margin:8px 0 4px}
.palette button{width:28px;height:28px;border-radius:50%}
.palette button.on{box-shadow:0 0 0 2px var(--bg),0 0 0 4px var(--ink)}

/* detail */
.dmedia{display:flex;flex-direction:column;gap:10px;margin-bottom:14px}
.dmedia img,.dmedia video{width:100%;border-radius:12px;background:#000;display:block;max-height:70vh;object-fit:contain}
.dtime{font:600 20px/1.2 Fraunces,Georgia,serif}
.dsub{color:var(--muted);font-size:13px;margin:2px 0 12px}
.dtext{white-space:pre-wrap;word-break:break-word;font-size:16px;margin-bottom:12px}

/* dialog + toast */
.dlg-bg{position:fixed;inset:0;background:rgba(0,0,0,.4);z-index:40;display:grid;place-items:center;padding:24px}
.dlg{background:var(--card);border-radius:18px;padding:20px;max-width:340px;width:100%}
.dlg h3{margin:0 0 6px;font-size:17px}
.dlg p{margin:0 0 16px;color:var(--muted)}
.dlg .row{display:flex;gap:8px;justify-content:flex-end}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(var(--sb) + 86px);background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:12px;z-index:50;font-size:14px;max-width:90vw;text-align:center}
.loading{display:grid;place-items:center;min-height:60vh;color:var(--muted)}
.spin{width:28px;height:28px;border:3px solid var(--line);border-top-color:var(--accent);border-radius:50%;animation:sp 1s linear infinite;margin:0 auto 10px}
@keyframes sp{to{transform:rotate(360deg)}}
</style>
</head>
<body>

<header>
  <div class="toprow">
    <h1>Fältanteckningar</h1>
    <button class="iconbtn" id="btnTags" aria-label="Taggbibliotek">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M20.6 13.4 13.4 20.6a2 2 0 0 1-2.8 0L3 13V3h10l7.6 7.6a2 2 0 0 1 0 2.8Z"/><circle cx="7.5" cy="7.5" r="1.5"/></svg>
    </button>
    <button class="iconbtn hidden" id="btnBackup" aria-label="Säkerhetskopia">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3v12M7 10l5 5 5-5"/><path d="M4 17v3h16v-3"/></svg>
    </button>
  </div>
  <div class="search"><input id="q" type="search" placeholder="Sök i noteringar…" autocomplete="off"></div>
  <div class="chips" id="filterChips"></div>
  <div class="mode" id="modeInfo"></div>
</header>

<main id="list"><div class="loading"><div><div class="spin"></div>Laddar…</div></div></main>

<button class="fab" id="btnNew">
  <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg>
  Ny notering
</button>

<!-- hidden file inputs -->
<input type="file" id="inPhoto" accept="image/*" capture="environment" class="hidden">
<input type="file" id="inPhotoLib" accept="image/*" multiple class="hidden">
<input type="file" id="inVideo" accept="video/*" capture="environment" class="hidden">
<input type="file" id="inVideoLib" accept="video/*" class="hidden">
<input type="file" id="inImport" accept="application/json,.json" class="hidden">

<div id="layer"></div>

<script>
(() => {
"use strict";
const $ = (s, el = document) => el.querySelector(s);
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({ "&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;" }[c]));
const uid = () => Date.now().toString(36) + Math.random().toString(36).slice(2, 8);
const PALETTE = ["#2f5d50","#c2593f","#d49a2a","#3b6ea5","#7a4f9e","#b8467a","#5a8f3a","#6b6259","#1f8a8a","#a0522d"];
const MAX_VIDEO_MB = 20;
const STANDALONE = !(window.claude && typeof window.claude.use === "function");
if (STANDALONE) {
  try { if ("serviceWorker" in navigator && location.protocol === "https:") navigator.serviceWorker.register("sw.js").catch(() => {}); } catch (e) {}
  try { navigator.storage && navigator.storage.persist && navigator.storage.persist(); } catch (e) {}
}

/* ---------------- state ---------------- */
let notes = [];        // sorted desc by ts
let tags = [];         // [{id,name,color}]
let filterTags = new Set();
let query = "";

/* ---------------- storage: local (IndexedDB) ---------------- */
const Local = {
  db: null, urls: new Map(),
  open() {
    return new Promise((res, rej) => {
      const r = indexedDB.open("faltanteckningar", 1);
      r.onupgradeneeded = () => {
        const d = r.result;
        d.createObjectStore("notes", { keyPath: "id" });
        d.createObjectStore("media");
        d.createObjectStore("kv");
      };
      r.onsuccess = () => { this.db = r.result; res(); };
      r.onerror = () => rej(r.error);
    });
  },
  tx(store, mode, fn) {
    return new Promise((res, rej) => {
      const t = this.db.transaction(store, mode); const s = t.objectStore(store);
      const out = fn(s); t.oncomplete = () => res(out && out.result); t.onerror = () => rej(t.error);
    });
  },
  async init() { await this.open(); },
  async loadNotes() { return (await this.tx("notes", "readonly", s => s.getAll())) || []; },
  async saveNote(n) { await this.tx("notes", "readwrite", s => s.put(n)); },
  async deleteNote(id) { await this.tx("notes", "readwrite", s => s.delete(id)); },
  async loadTags() { return (await this.tx("kv", "readonly", s => s.get("tags"))) || null; },
  async saveTags(t) { await this.tx("kv", "readwrite", s => s.put(t, "tags")); },
  async upload(blob) { const ref = "m_" + uid(); await this.tx("media", "readwrite", s => s.put(blob, ref)); return { ref, url: "" }; },
  async url(m) {
    if (this.urls.has(m.ref)) return this.urls.get(m.ref);
    const b = await this.tx("media", "readonly", s => s.get(m.ref));
    const u = b ? URL.createObjectURL(b) : ""; this.urls.set(m.ref, u); return u;
  },
  async removeMedia(m) { await this.tx("media", "readwrite", s => s.delete(m.ref)); },
};

/* ---------------- storage: cloud (artifact db + assets) ---------------- */
const Cloud = {
  db: null, assets: null, uid: null,
  notesCol() { return this.db.doc(`data/users/${this.uid}/notes`).collection("items"); },
  tagsDoc() { return this.db.doc(`data/users/${this.uid}/tags`); },
  async saveNote(n) { await this.notesCol().doc(n.id).set(n); },
  async deleteNote(id) { await this.notesCol().doc(id).delete(); },
  async saveTags(t) { await this.tagsDoc().set({ list: t }); },
  async upload(blob) { const r = await this.assets.upload(blob); return { ref: r.id, url: r.url || ("/_blob/" + r.id) }; },
  async url(m) { return m.url || ("/_blob/" + m.ref); },
  async removeMedia(m) { try { await this.assets.delete(m.ref); } catch (e) {} },
};

let S = Local; let mode = "local";

function withTimeout(p, ms) { return Promise.race([p, new Promise(r => setTimeout(() => r(null), ms))]); }

async function boot() {
  let cloudOk = false;
  try {
    if (window.claude && typeof window.claude.use === "function") {
      const [db, user, assets] = await withTimeout(Promise.all([
        claude.use("db"), claude.use("user"), claude.use("assets")
      ]), 11000) || [];
      const id = user ? await user.id() : null;
      if (db && id && assets) { Cloud.db = db; Cloud.uid = id; Cloud.assets = assets; cloudOk = true; }
    }
  } catch (e) { cloudOk = false; }

  if (cloudOk) {
    S = Cloud; mode = "cloud";
    $("#modeInfo").textContent = "Sparas privat i ditt konto – syns på alla dina enheter.";
    startCloud();
  } else {
    try { await Local.init(); } catch (e) { toast("Kunde inte öppna lagring i webbläsaren."); }
    $("#modeInfo").textContent = "Sparas på den här telefonen.";
    $("#btnBackup").classList.remove("hidden");
    notes = (await Local.loadNotes().catch(() => [])).sort((a, b) => b.ts - a.ts);
    const saved = await Local.loadTags().catch(() => null);
    tags = saved || defaultTags();
    if (!saved) Local.saveTags(tags).catch(() => {});
    renderAll();
  }
}

function startCloud() {
  let gotNotes = false, gotTags = false, seeded = false;
  const timer = setTimeout(() => { if (!gotNotes) { toast("Når inte lagringen ännu – försöker igen…"); } }, 10000);
  Cloud.tagsDoc().onSnapshot(snap => {
    gotTags = true;
    const d = snap.exists ? snap.data() : null;
    if (d && Array.isArray(d.list)) tags = d.list.map(t => ({ ...t }));
    else if (!snap.metadata.fromCache && !seeded) { seeded = true; tags = defaultTags(); Cloud.saveTags(tags).catch(() => {}); }
    renderAll();
  }, e => { gotTags = true; renderAll(); });
  Cloud.notesCol().orderBy("ts", "desc").onSnapshot(snap => {
    if (!snap.metadata.fromCache) clearTimeout(timer);
    gotNotes = true;
    notes = snap.docs.map(d => ({ ...d.data(), id: d.id }));
    renderAll();
  }, e => { clearTimeout(timer); gotNotes = true; toast("Kunde inte läsa noteringar (" + e.code + ")."); renderAll(); });
}

function defaultTags() {
  return [
    { id: uid(), name: "Observation", color: PALETTE[0] },
    { id: uid(), name: "Idé", color: PALETTE[2] },
    { id: uid(), name: "Att göra", color: PALETTE[1] },
  ];
}

/* ---------------- formatting ---------------- */
const fmtTime = ts => new Date(ts).toLocaleTimeString("sv-SE", { hour: "2-digit", minute: "2-digit" });
const fmtDayKey = ts => { const d = new Date(ts); return d.getFullYear() + "-" + d.getMonth() + "-" + d.getDate(); };
function fmtDay(ts) {
  const d = new Date(ts), t = new Date(); const y = new Date(); y.setDate(t.getDate() - 1);
  const same = (a, b) => a.toDateString() === b.toDateString();
  if (same(d, t)) return "Idag";
  if (same(d, y)) return "Igår";
  return d.toLocaleDateString("sv-SE", { weekday: "long", day: "numeric", month: "long", year: d.getFullYear() === t.getFullYear() ? undefined : "numeric" });
}
const fmtFull = ts => new Date(ts).toLocaleString("sv-SE", { weekday: "long", day: "numeric", month: "long", year: "numeric", hour: "2-digit", minute: "2-digit", second: "2-digit" });
const toLocalInput = ts => { const d = new Date(ts); d.setMinutes(d.getMinutes() - d.getTimezoneOffset()); return d.toISOString().slice(0, 19); };
const tagById = id => tags.find(t => t.id === id);
const MOODS = { sad: { e: "😞", label: "Ledsen" }, neutral: { e: "😐", label: "Neutral" }, happy: { e: "😊", label: "Glad" } };
const moodOf = n => MOODS[n.mood] ? n.mood : "neutral";
const PREVIEW_CHARS = 45;
const preview = t => { const c = [...String(t || "").replace(/\s+/g, " ").trim()]; return c.length > PREVIEW_CHARS ? c.slice(0, PREVIEW_CHARS).join("").trimEnd() + "…" : c.join(""); };

/* ---------------- location helpers ---------------- */
const PIN = `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linejoin="round"><path d="M12 21s-7-6.2-7-11.5A7 7 0 0 1 19 9.5C19 14.8 12 21 12 21z"/><circle cx="12" cy="9.5" r="2.5"/></svg>`;
const hasCoords = l => l && typeof l.lat === "number" && typeof l.lng === "number";
const fmtCoords = l => `${l.lat.toFixed(5)}, ${l.lng.toFixed(5)}`;
const locLabel = l => l ? (l.address || l.name || (hasCoords(l) ? fmtCoords(l) : "")) : "";
const distM = (a, b) => { const k = Math.PI / 180, x = (b.lng - a.lng) * k * Math.cos((a.lat + b.lat) / 2 * k), y = (b.lat - a.lat) * k; return Math.sqrt(x * x + y * y) * 6371000; };

/* reverse geocoding (OpenStreetMap Nominatim: max 1 request/second, results cached) */
function fmtAddress(j) {
  if (!j || j.error) return "";
  const a = j.address || {};

    };
    try {
      watchId = navigator.geolocation.watchPosition(accept, err => { if (!best) fail(); else stopWatch(); },
        { enableHighAccuracy: true, timeout: 20000, maximumAge: 30000 });
      watchTimer = setTimeout(() => { stopWatch(); if (!best) fail(); else setStatus(geoStatus.innerHTML.replace(" – förbättras…", " – GPS"), true); }, 25000);
    } catch (e) { fail(); }
  }
  geoOn.addEventListener("change", () => {
    showGeo(); setPref("geoDefault", geoOn.checked ? "1" : "0");
    if (!geoOn.checked) { stopWatch(); return; }
    if (!coordsIn.value.trim()) askPosition(true);
  });
  coordsIn.addEventListener("input", () => { stopWatch(); locSource = "manual"; locAcc = null; checkCoords(); const ll = parseCoords(coordsIn.value); if (ll) scheduleLookup(ll); });
  bg._onPhotoGps = g => { if (geoOn.checked && (!coordsIn.value.trim())) { stopWatch(); setLL(g, "photo"); setStatus(geoStatus.innerHTML + " – från bilden", true); } };
  if (isNew && geoOn.checked) askPosition(true);
  function readLocation() {
    if (!geoOn.checked) return { ok: true, loc: null };
    const address = addrIn.value.trim(); const raw = coordsIn.value.trim();
    const ll = raw ? parseCoords(raw) : null;
    if (raw && !ll) return { ok: false };
    if (!ll && !address) return { ok: true, loc: null };
    const loc = { address, addrSource: addrManual ? "manual" : "lookup" };
    if (ll) { loc.lat = ll.lat; loc.lng = ll.lng; loc.source = locSource || "manual"; if (locAcc) loc.acc = Math.round(locAcc); }
    return { ok: true, loc };
  }

  bg.addEventListener("click", async e => {
    const t = e.target;
    if (t.closest("[data-close]")) return closeSheet(bg);
    const pick = t.closest("[data-pick]");
    if (pick) {
      pickTarget = async (files, kind) => {
        for (const f of files) {
          if (kind === "video" && f.size > MAX_VIDEO_MB * 1024 * 1024) { toast(`Filmen är ${(f.size / 1048576).toFixed(0)} MB – max ${MAX_VIDEO_MB} MB. Spela in en kortare.`); continue; }
          const gps = kind === "image" ? await readExifGps(f) : null;
          const blob = kind === "image" ? await shrinkImage(f) : f;
          media.push({ id: uid(), kind, blob, name: f.name || "", gps });
          if (gps) bg._onPhotoGps(gps);
        }
        drawMedia();
      };
      $("#" + pick.dataset.pick).click(); return;
    }
    const rm = t.closest("[data-rm]");
    if (rm) { const [m] = media.splice(+rm.dataset.rm, 1); if (m && !m.blob) removed.push(m); drawMedia(); return; }
    const md = t.closest("[data-mood]");
    if (md) { mood = md.dataset.mood; bg.querySelectorAll("[data-mood]").forEach(b => { const on = b.dataset.mood === mood; b.classList.toggle("on", on); b.setAttribute("aria-pressed", on); }); return; }
    const tg = t.closest("[data-t]");
    if (tg) { const id = tg.dataset.t; selTags.has(id) ? selTags.delete(id) : selTags.add(id); drawTags(); return; }
    if (t.closest("[data-managetags]")) { openTagManager(() => drawTags()); return; }
    if (t.closest("[data-geo-here]")) { askPosition(false); return; }
    if (t.closest("[data-geo-photo]")) {
      const g = photoGps();
      if (g) { stopWatch(); setLL(g, "photo"); setStatus(geoStatus.innerHTML + " – från bilden", true); }
      else setStatus(media.some(m => m.kind === "image" && m.blob) ? "Bilderna saknar platsdata – telefonen tar ofta bort den när en bild delas med en webbsida." : "Lägg först till en bild som har platsdata.");
      return;
    }
    if (t.closest("[data-del]")) {
      if (await confirmDlg("Ta bort noteringen?", "Noteringen och dess bilder och filmer tas bort för gott.")) { await removeNote(existing); closeSheet(bg); }
      return;
    }
    const save = t.closest("[data-save]");
    if (save) {
      const text = $("#eText", bg).value.trim();
      if (!text && !$("#eTitle", bg).value.trim() && !media.length && !selTags.size) { toast("Skriv något eller lägg till bild/film."); return; }
      const tsVal = $("#eTs", bg).value; const ts = tsVal ? new Date(tsVal).getTime() : Date.now();
      const L = readLocation();
      if (!L.ok) { toast("Koordinaterna känns inte igen – rätta dem eller töm fältet."); coordsIn.focus(); return; }
      save.disabled = true;
      try {
        const out = [];
        let k = 0; const pend = media.filter(m => m.blob).length;
        for (const m of media) {
          if (m.blob) {
            k++; save.textContent = pend > 1 ? `Laddar upp ${k}/${pend}…` : "Laddar upp…";
            const r = await S.upload(m.blob);
            out.push({ id: m.id, kind: m.kind, ref: r.ref, url: r.url || "", type: m.blob.type || "" });
          } else out.push({ id: m.id, kind: m.kind, ref: m.ref, url: m.url || "", type: m.type || "" });
        }
        save.textContent = "Sparar…";
        const note = { id: n.id, ts: isNaN(ts) ? Date.now() : ts, title: $("#eTitle", bg).value.trim(), mood, text, tags: [...selTags].filter(tagById), media: out,
                       created: n.created || Date.now(), updated: Date.now() };
        if (L.loc) note.location = L.loc;
        await S.saveNote(note);
        for (const m of removed) await S.removeMedia(m);
        if (mode === "local") { notes = notes.filter(x => x.id !== note.id).concat(note).sort((a, b) => b.ts - a.ts); renderAll(); }
        closeSheet(bg); toast(isNew ? "Noteringen är sparad." : "Ändringarna är sparade.");
      } catch (err) {
        save.disabled = false; save.textContent = "Spara";
        toast(err && err.code === "quota_exceeded" ? "Lagringen är full – ta bort gamla noteringar eller filmer." : "Kunde inte spara: " + (err && (err.message || err.code) || "okänt fel"));
      }
    }
  });
  if (isNew) setTimeout(() => $("#eText", bg).focus(), 250);
}

async function removeNote(n) {
  try {
    await S.deleteNote(n.id);
    for (const m of n.media || []) await S.removeMedia(m);
    if (mode === "local") { notes = notes.filter(x => x.id !== n.id); renderAll(); }
    toast("Noteringen är borttagen.");
  } catch (e) { toast("Kunde inte ta bort: " + (e.message || e.code)); }
}

/* ---------------- detail ---------------- */
function openDetail(id) {
  const n = notes.find(x => x.id === id); if (!n) return;
  const tagHtml = (n.tags || []).map(tagById).filter(Boolean).map(t => `<span class="chip"><span class="dot" style="background:${esc(t.color)}"></span>${esc(t.name)}</span>`).join("");
  const bg = openSheet(`
    <div class="sheet-head"><h2>Notering</h2><button class="iconbtn" data-close aria-label="Stäng">${X_ICON}</button></div>
    <div class="sheet-body">
      ${n.title ? `<div class="dtitle">${esc(n.title)}</div>` : ""}
      <div class="dtime" ${n.title ? 'style="font-size:15px;font-family:Inter,system-ui,sans-serif"' : ""}>${esc(fmtDay(n.ts))} · ${fmtTime(n.ts)}</div>
      <div class="dsub">${esc(fmtFull(n.ts))}</div>
      <div class="dmood"><span>${MOODS[moodOf(n)].e}</span>${MOODS[moodOf(n)].label}</div>
      ${n.text ? `<div class="dtext">${esc(n.text)}</div>` : ""}
      ${n.location && locLabel(n.location) ? `<div class="dloc">
        <div class="nm">${PIN}${esc(n.location.address || n.location.name || "Adress saknas")}</div>
        ${hasCoords(n.location) ? `<div class="co">${fmtCoords(n.location)}${n.location.acc ? ` · ±${n.location.acc} m` : ""}${n.location.source === "photo" ? " · från bilden" : n.location.source === "gps" ? " · GPS" : ""}</div>
        <a href="https://www.openstreetmap.org/?mlat=${n.location.lat}&mlon=${n.location.lng}#map=16/${n.location.lat}/${n.location.lng}" target="_blank" rel="noopener">OpenStreetMap</a><a href="https://www.google.com/maps/search/?api=1&query=${n.location.lat},${n.location.lng}" target="_blank" rel="noopener">Google Maps</a>` : ""}
      </div>` : ""}
      <div class="dmedia" id="dMedia"></div>
      ${tagHtml ? `<div class="tagpick">${tagHtml}</div>` : ""}
    </div>
    <div class="sheet-foot"><button class="btn danger" data-del>Ta bort</button><button class="btn primary" data-edit>Redigera</button></div>`);
  const box = $("#dMedia", bg);
  (n.media || []).forEach(async m => {
    const holder = document.createElement("div"); box.appendChild(holder);
    const u = await S.url(m); if (!u) return;
    const el = m.kind === "video" ? Object.assign(document.createElement("video"), { src: u, controls: true, playsInline: true, preload: "metadata" })
                                  : Object.assign(document.createElement("img"), { src: u, alt: "" });
    holder.appendChild(el);
  });
  bg.addEventListener("click", async e => {
    if (e.target.closest("[data-close]")) return closeSheet(bg);
    if (e.target.closest("[data-edit]")) { closeSheet(bg); openEditor(n); return; }
    if (e.target.closest("[data-del]")) {
      if (await confirmDlg("Ta bort noteringen?", "Noteringen och dess bilder och filmer tas bort för gott.")) { closeSheet(bg); await removeNote(n); }
    }
  });
}

/* ---------------- tag library ---------------- */
async function persistTags() {
  try { await S.saveTags(tags); } catch (e) { toast("Kunde inte spara taggar: " + (e.message || e.code)); }
}
function openTagManager(onChange) {
  let newColor = PALETTE[tags.length % PALETTE.length];
  const bg = openSheet(`
    <div class="sheet-head"><h2>Taggbibliotek</h2><button class="iconbtn" data-close aria-label="Stäng">${X_ICON}</button></div>
    <div class="sheet-body">
      <label class="lbl">Ny tagg</label>
      <div style="display:flex;gap:8px"><input class="field" id="tNew" placeholder="Namn på taggen" maxlength="40"><button class="btn primary" style="flex:none" data-add>Lägg till</button></div>
      <div class="palette" id="tPal"></div>
      <label class="lbl">Dina taggar</label>
      <div id="tList"></div>
      <div class="hint">Tryck på ett namn för att byta namn. Tryck på färgen för att byta färg.</div>
    </div>`);
  const counts = () => { const c = {}; for (const n of notes) for (const t of n.tags || []) c[t] = (c[t] || 0) + 1; return c; };
  function drawPal() { $("#tPal", bg).innerHTML = PALETTE.map(c => `<button data-pal="${c}" class="${c === newColor ? "on" : ""}" style="background:${c}" aria-label="Färg"></button>`).join(""); }
  function drawList() {
    const c = counts();
    $("#tList", bg).innerHTML = tags.length ? tags.map(t => `
      <div class="trow" data-id="${esc(t.id)}">
        <button class="swatch" data-cycle style="background:${esc(t.color)}" aria-label="Byt färg"></button>
        <input value="${esc(t.name)}" maxlength="40" data-name>
        <span class="count">${c[t.id] || 0}</span>
        <button class="iconbtn" data-tdel aria-label="Ta bort tagg" style="width:34px;height:34px;background:none;color:var(--danger)">${X_ICON}</button>
      </div>`).join("") : `<div class="hint">Inga taggar. Lägg till din första ovan.</div>`;
  }
  drawPal(); drawList();
  const changed = async () => { await persistTags(); if (mode === "local") renderAll(); onChange && onChange(); };

  async function add() {
    const inp = $("#tNew", bg); const name = inp.value.trim(); if (!name) return;
    if (tags.some(t => t.name.toLowerCase() === name.toLowerCase())) { toast("Taggen finns redan."); return; }
    tags = [...tags, { id: uid(), name, color: newColor }];
    inp.value = ""; newColor = PALETTE[tags.length % PALETTE.length]; drawPal(); drawList(); await changed();
  }
  $("#tNew", bg).addEventListener("keydown", e => { if (e.key === "Enter") { e.preventDefault(); add(); } });
  bg.addEventListener("change", async e => {
    const inp = e.target.closest("[data-name]"); if (!inp) return;
    const id = inp.closest(".trow").dataset.id; const name = inp.value.trim();
    if (!name) { inp.value = tagById(id).name; return; }
    tags = tags.map(t => t.id === id ? { ...t, name } : t); await changed();
  });
  bg.addEventListener("click", async e => {
    const t = e.target;
    if (t.closest("[data-close]")) { closeSheet(bg); return; }
    if (t.closest("[data-add]")) { add(); return; }
    const p = t.closest("[data-pal]"); if (p) { newColor = p.dataset.pal; drawPal(); return; }
    const row = t.closest(".trow"); if (!row) return;
    const id = row.dataset.id;
    if (t.closest("[data-cycle]")) {
      tags = tags.map(x => x.id === id ? { ...x, color: PALETTE[(PALETTE.indexOf(x.color) + 1) % PALETTE.length] } : x);
      drawList(); await changed(); return;
    }
    if (t.closest("[data-tdel]")) {
      const tg = tagById(id); const used = counts()[id] || 0;
      if (!(await confirmDlg(`Ta bort taggen "${tg.name}"?`, used ? `Den tas bort från ${used} notering${used > 1 ? "ar" : ""}. Noteringarna finns kvar.` : "Taggen används inte i någon notering."))) return;
      tags = tags.filter(x => x.id !== id);
      for (const n of notes.filter(n => (n.tags || []).includes(id))) {
        const upd = { ...n, tags: n.tags.filter(x => x !== id), updated: Date.now() };
        try { await S.saveNote(upd); } catch (err) {}
        if (mode === "local") notes = notes.map(x => x.id === n.id ? upd : x);
      }
      drawList(); await changed();
    }
  });
}


/* ---------------- backup (local mode) ---------------- */
const blobToDataURL = b => new Promise((res, rej) => { const r = new FileReader(); r.onload = () => res(r.result); r.onerror = rej; r.readAsDataURL(b); });
const safeFileName = (raw, fallback) => {
  let s = String(raw || "").trim().replace(/\.json$/i, "").replace(/[\\/:*?"<>|\u0000-\u001f]+/g, "-").replace(/\s+/g, " ").replace(/^[.\s-]+|[.\s]+$/g, "");
  return (s || fallback).slice(0, 100) + ".json";
};
const defaultExportName = () => `faltanteckningar-${new Date().toISOString().slice(0, 10)}`;
async function exportAll(btn, chosenName) {
  btn.disabled = true; btn.textContent = "Packar…";
  try {
    const out = [];
    for (const n of notes) {
      const media = [];
      for (const m of n.media || []) {
        const b = await Local.tx("media", "readonly", s => s.get(m.ref));
        media.push({ ...m, data: b ? await blobToDataURL(b) : null });
      }
      out.push({ ...n, media });
    }
    const json = JSON.stringify({ app: "faltanteckningar", version: 1, exported: new Date().toISOString(), tags, notes: out });
    const name = safeFileName(chosenName, defaultExportName());
    const file = new File([json], name, { type: "application/json" });
    if (navigator.canShare && navigator.canShare({ files: [file] })) {
      try { await navigator.share({ files: [file], title: "Fältanteckningar – säkerhetskopia" }); toast("Säkerhetskopian är klar."); return; }
      catch (e) { if (e && e.name === "AbortError") return; }
    }
    const a = document.createElement("a"); a.href = URL.createObjectURL(file); a.download = name;
    document.body.appendChild(a); a.click(); setTimeout(() => { URL.revokeObjectURL(a.href); a.remove(); }, 2000);
    toast("Säkerhetskopian har laddats ner.");
  } catch (e) { toast("Kunde inte exportera: " + (e.message || e)); }
  finally { btn.disabled = false; btn.textContent = "Exportera allt"; }
}
async function importAll(file) {
  try {
    const data = JSON.parse(await file.text());
    if (data.app !== "faltanteckningar" || !Array.isArray(data.notes)) throw new Error("Filen är ingen säkerhetskopia från Fältanteckningar.");
    const byId = new Map(tags.map(t => [t.id, t]));
    for (const t of data.tags || []) if (!byId.has(t.id)) byId.set(t.id, t);
    tags = [...byId.values()]; await Local.saveTags(tags);
    let added = 0;
    for (const n of data.notes) {
      if (notes.some(x => x.id === n.id)) continue;
      const media = [];
      for (const m of n.media || []) {
        if (!m.data) continue;
        const blob = await (await fetch(m.data)).blob();
        const r = await Local.upload(blob);
        const { data: _d, ...rest } = m; media.push({ ...rest, ref: r.ref, url: "" });
      }
      const note = { ...n, media }; await Local.saveNote(note); notes.push(note); added++;
    }
    notes.sort((a, b) => b.ts - a.ts); renderAll();
    toast(added ? `${added} notering${added > 1 ? "ar" : ""} importerades.` : "Inga nya noteringar i filen.");
  } catch (e) { toast("Kunde inte importera: " + (e.message || e)); }
}
$("#inImport").addEventListener("change", e => { const f = e.target.files[0]; e.target.value = ""; if (f) importAll(f); });
function openBackup() {
  const bg = openSheet(`
    <div class="sheet-head"><h2>Säkerhetskopia</h2><button class="iconbtn" data-close aria-label="Stäng">${X_ICON}</button></div>
    <div class="sheet-body">
      <p style="margin-top:0">Noteringarna sparas bara på den här telefonen. Exportera regelbundet och spara filen i t.ex. iCloud Drive eller Google Drive, så tappar du inget om telefonen byts ut.</p>
      <p class="hint">${notes.length} noteringar · ${notes.reduce((s, n) => s + (n.media || []).length, 0)} bilder/filmer</p>
      <div style="display:flex;flex-direction:column;gap:10px;margin-top:14px">
        <label class="lbl" for="bName" style="margin:4px 0 0">Filnamn</label>
        <div style="display:flex;align-items:center;gap:6px"><input class="field" id="bName" maxlength="100" value="${esc(defaultExportName())}" autocomplete="off"><span class="hint" style="margin:0">.json</span></div>
        <button class="btn primary" data-export>Exportera allt</button>
        <button class="btn" data-import>Importera från fil…</button>
      </div>
      <p class="hint" style="margin-top:12px">Vid import läggs bara noteringar till som inte redan finns – inget skrivs över.</p>
    </div>`);
  bg.addEventListener("click", e => {
    if (e.target.closest("[data-close]")) return closeSheet(bg);
    const ex = e.target.closest("[data-export]"); if (ex) { const v = $("#bName", bg).value.trim(); return exportAll(ex, v); }
    if (e.target.closest("[data-import]")) { closeSheet(bg); $("#inImport").click(); }
  });
}
$("#btnBackup").addEventListener("click", openBackup);

/* ---------------- wire up ---------------- */
$("#btnNew").addEventListener("click", () => openEditor(null));
$("#btnTags").addEventListener("click", () => openTagManager(() => {
  layer.querySelectorAll(".sheet-bg").forEach(b => b._redrawTags && b._redrawTags());
}));

boot();
})();
</script>
